spring:
  datasource:
    # Testcontainers JDBC: 테스트 실행 시 Postgres 컨테이너 자동 기동
    url: jdbc:tc:postgresql:16-alpine:///testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

jwt:
  secret: test_secret_test_secret_test_secret_test_secret_1234
  access-token-validity-in-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_IN_SECONDS:3600}
  refresh-token-validity-in-seconds: ${JWT_REFRESH_TOKEN_VALIDITY_IN_SECONDS:1209600}

logging:
  level:
    org.springframework.boot.context.properties: TRACE

grpc:
  server:
    port: 0
